# PostgreSQL for local development.
# Port 5433 on the host avoids clashing with a native Postgres on 5432.
# Bring it up with `npm run db:up` (docker compose up -d).
services:
  postgres:
    image: postgres:16-alpine
    container_name: sibero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sibero
      POSTGRES_PASSWORD: sibero
      POSTGRES_DB: sibero
    ports:
      - "5433:5432"
    volumes:
      - sibero-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sibero -d sibero"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sibero-pgdata:
